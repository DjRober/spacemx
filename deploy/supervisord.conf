# supervisord lanza los 7 servicios Node + nginx dentro del mismo contenedor.
# Cada servicio hereda las variables del entorno (NASA_API_KEY, JWT_SECRET,
# DATABASE_URL, DATABASE_SSL, ...) que Render inyecta; solo se sobreescribe
# PORT para que cada uno escuche en su puerto fijo. Todos los logs van a
# stdout/stderr para que Render los capture.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:apod]
directory=/app/services/apod-service
command=node index.js
environment=PORT="3001"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mars]
directory=/app/services/mars-weather-service
command=node index.js
environment=PORT="3002"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:neows]
directory=/app/services/neows-service
command=node index.js
environment=PORT="3003"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:iss-tracker]
directory=/app/services/iss-tracker-service
command=node index.js
environment=PORT="3004"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth]
directory=/app/services/auth-service
command=node index.js
environment=PORT="3005"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reports]
directory=/app/services/reports-service
command=node index.js
environment=PORT="3006"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:iss-alerts]
directory=/app/services/iss-alerts-service
command=node index.js
environment=PORT="3007"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
