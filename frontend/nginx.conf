# Reverse proxy + servidor del SPA para producción (Docker).
# nginx sirve los archivos estáticos del build de Vue y reenvía /api/* a
# cada microservicio por su nombre de servicio en la red de Docker Compose.
# Así todo queda bajo un mismo origen (un solo puerto público) y no hay CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── /api/* → microservicios ──────────────────────────────────
    # nginx reemplaza el texto del `location` por la URI del `proxy_pass`:
    #   /api/apod?date=X        → apod-service:3001/apod?date=X
    #   /api/marte/clima        → mars-weather-service:3002/marte/clima
    #   /api/reportes/<id>      → reports-service:3006/reportes/<id>
    # Los nombres (apod-service, ...) los resuelve el DNS interno de Compose.
    location /api/apod        { proxy_pass http://apod-service:3001/apod; }
    location /api/marte       { proxy_pass http://mars-weather-service:3002/marte; }
    location /api/asteroides  { proxy_pass http://neows-service:3003/asteroides; }
    location /api/iss         { proxy_pass http://iss-tracker-service:3004/iss; }
    location /api/alertas     { proxy_pass http://iss-alerts-service:3007/alertas; }
    location /api/auth        { proxy_pass http://auth-service:3005/auth; }
    location /api/reportes    { proxy_pass http://reports-service:3006/reportes; }

    # Preserva el host y el header Authorization (JWT) hacia los servicios.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── SPA ──────────────────────────────────────────────────────
    # Cualquier ruta que no sea un archivo real devuelve index.html, para
    # que el enrutado de Vue funcione también con recarga de página.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
